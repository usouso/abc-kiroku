<title>ABC記録ノート</title>
<style>
/* Layout: one-column phone tool — child picker on top, tap-chip form, sticky save bar above bottom tabs */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#1B2530; --muted:#5A6875; --line:#D8DFE5; --chip:#EBEFF3;
  --accent:#2C679A; --accent-ink:#FFFFFF; --accent-soft:#E3EDF6;
  --challenge:#B9541C; --challenge-soft:#FAEADF; --good:#2B7A52; --good-soft:#E2F2E9; --danger:#B42318;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.06);
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --font-body:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2129; --ink:#E5EAEF; --muted:#9AA7B3; --line:#2B3540; --chip:#232C36;
  --accent:#6FA8DC; --accent-ink:#0E1620; --accent-soft:#1E3043;
  --challenge:#EE9A62; --challenge-soft:#3A2619; --good:#63C28F; --good-soft:#18342A; --danger:#F07A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2129; --ink:#E5EAEF; --muted:#9AA7B3; --line:#2B3540; --chip:#232C36;
  --accent:#6FA8DC; --accent-ink:#0E1620; --accent-soft:#1E3043;
  --challenge:#EE9A62; --challenge-soft:#3A2619; --good:#63C28F; --good-soft:#18342A; --danger:#F07A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
/* ホーム画面アプリで、スクロールした内容が時刻・電池の表示に重ならないよう上端を覆う */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.update-bar{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:25;max-width:608px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;box-shadow:var(--shadow)}
.update-bar button{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px 10px}
.top h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;letter-spacing:.02em}
.top h1 small{display:block;font-family:var(--font-body);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.04em}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
h2{font-family:var(--font-display);font-size:17px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;margin:0;color:var(--muted);letter-spacing:.06em}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.sample-bar{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* child picker */
.kids{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.kid{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.kid[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kid.add{border-style:dashed;color:var(--muted);font-weight:400}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.type button[data-v="challenge"][aria-pressed="true"]{color:var(--challenge)}
.seg.type button[data-v="good"][aria-pressed="true"]{color:var(--good)}

/* ABC chips */
.abc{display:grid;grid-template-columns:28px 1fr;gap:10px 10px}
.abc .letter{font-family:var(--font-num);font-weight:800;font-size:15px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--chip);color:var(--muted);margin-top:2px}
.abc .letter.on{background:var(--ink);color:var(--surface)}
.abc .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:42px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;line-height:1.3;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft);font-weight:700}
.chip.plus{border-style:dashed;color:var(--muted);min-width:44px;text-align:center}
.t-challenge{--sel:var(--challenge);--sel-soft:var(--challenge-soft)}
.t-good{--sel:var(--good);--sel-soft:var(--good-soft)}
.addline{display:flex;gap:6px}
.addline input{flex:1;min-width:0}
input[type=text],input[type=datetime-local],select,textarea{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px;min-height:42px;width:100%;font-size:16px}
textarea{resize:vertical;min-height:72px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.int{display:flex;gap:6px}
.int button{flex:1;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.int button[aria-pressed="true"]{border-color:var(--challenge);background:var(--challenge-soft);font-weight:700}

.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}

.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:8px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.savebar .in{max-width:608px;margin:0 auto;display:flex;gap:8px}
.savebar .btn.primary{flex:1;min-height:52px;font-size:17px;border-radius:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* record list */
.list{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.rec:first-child{border-top:0}
.rec .tm{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.rec .tm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.rec .what{min-width:0;display:flex;flex-direction:column;gap:2px}
.rec .what b{font-weight:700}
.rec .flow{font-size:13px;color:var(--muted)}
.rec .memo{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.pill.challenge{background:var(--challenge-soft);color:var(--challenge)}
.pill.good{background:var(--good-soft);color:var(--good)}
.rec .ops{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px}

/* review */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;line-height:1.15}
.tile .v small{font-size:14px;font-weight:600;margin-left:2px}
.tile .s{font-size:12px;color:var(--muted)}
.tile.challenge .v{color:var(--challenge)}
.tile.good .v{color:var(--good)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2.4em;gap:8px;align-items:center;font-size:13.5px}
.bar-row .bl{overflow-wrap:anywhere;line-height:1.3}
.bar-row .bt{height:14px;background:var(--chip);border-radius:0 4px 4px 0;overflow:hidden}
.bar-row .bf{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--c)}
.bar-row .bn{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}
.hours{display:grid;gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line);position:relative}
.hours button{height:100%;border:0;padding:0;background:transparent;display:flex;align-items:flex-end;border-radius:4px 4px 0 0}
.hours button span{display:block;width:100%;background:var(--c);border-radius:4px 4px 0 0;min-height:0}
.hours button[aria-pressed="true"] span{outline:2px solid var(--ink);outline-offset:1px}
.hours .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.hlabels{display:grid;gap:2px;font-size:11px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.hlabels span{text-align:center;white-space:nowrap;overflow:visible}
.tip{font-size:13px;min-height:1.6em;font-variant-numeric:tabular-nums}
.fn-row{display:grid;grid-template-columns:4.5em 1fr 3em;gap:8px;align-items:center}
.fn-row .bl b{display:block;font-size:14px}
.fn-row .desc{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"＋";color:var(--muted)}
details.card[open] summary::after{content:"−"}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps code{font-family:inherit;background:var(--chip);padding:1px 6px;border-radius:6px;font-weight:600}
.note.warn{color:var(--danger);font-weight:600}
.field.flash .btn{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);transition:box-shadow .3s}
.ai-out{overflow-wrap:anywhere;font-size:14.5px;line-height:1.7;background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ai-out h4{margin:8px 0 0;font-size:14px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.ai-out h4:first-child{margin-top:0}
.ai-out h4::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--accent)}
.ai-out p{margin:0}
.ai-out ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ai-out li{position:relative;padding-left:1.1em}
.ai-out li::before{content:"・";position:absolute;left:0;color:var(--muted)}

/* settings */
.set-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.set-row select{width:auto;min-width:5.5em}
.chipedit{display:flex;flex-direction:column;gap:6px}
.chipedit .ce{display:grid;grid-template-columns:1fr auto 36px;gap:6px;align-items:center;font-size:14px;padding:4px 0;border-top:1px solid var(--line)}
.chipedit .ce:first-child{border-top:0}
.chipedit .ce select{width:auto;min-height:36px;padding:4px 8px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s}
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet p{margin:0;white-space:pre-wrap}
.sheet .row .btn{flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>ABC記録ノート<small>きっかけ → 行動 → その後</small></h1>
    <span class="badge" id="storeBadge">この端末だけに保存</span>

</div>
<div class="savebar" id="savebar"></div>
<nav class="tabs" aria-label="画面切り替え"><div class="in">

  <button type="button" data-act="tab" data-v="review"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ふりかえり</button>
  <button type="button" data-act="tab" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</button>
</div></nav>

<script>
(function(){
'use strict';
var KEY='abc-kiroku-v1';
var SHORTCUT_NAME='ABC記録まとめ';
var APP_VERSION='プレビュー版';
var FN={
  demand:{label:'要求',desc:'ほしい物・したいことがある'},
  escape:{label:'逃避',desc:'いやなことを避けたい・終わらせたい'},
  attention:{label:'注目',desc:'かかわってほしい・見てほしい'},
  sensory:{label:'感覚',desc:'その感覚がほしい・落ち着きたい'}
};
var FN_KEYS=['demand','escape','attention','sensory'];
var CATS=[['antecedent','A','きっかけ','行動の前に何があった？'],['behavior','B','行動','どんな行動？'],['consequence','C','その後','まわりはどう対応した？']];
var TYPES={challenge:'困った行動',good:'できたこと'};
var INTENSITY={1:'軽い',2:'中くらい',3:'強い'};
var WD=['日','月','火','水','木','金','土'];
var DAY=86400000;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function chip(label,fn){return {id:uid(),label:label,fn:fn||''};}
function pad(n){return (n<10?'0':'')+n;}
function fmtTime(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDate(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';}
function fmtYMD(ts){var d=new Date(ts);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();}
function toLocalInput(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function startOfDay(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}

function defaultChips(){return {
  challenge:{
    behavior:['大声・叫ぶ','たたく・ける','物を投げる','離席・飛び出し','泣く','自分をたたく・かむ','動かない・拒否','暴言'].map(function(l){return chip(l);}),
    antecedent:[chip('活動の切り替え','escape'),chip('苦手な課題・活動','escape'),chip('大きな音・人の多さ','escape'),chip('要求が通らない','demand'),chip('好きな物を終わりにした','demand'),chip('大人が離れた・注目なし','attention'),chip('待ち時間'),chip('予定の変更'),chip('友だちとのトラブル'),chip('一人で過ごしていた','sensory')],
    consequence:[chip('声かけ・注意した','attention'),chip('そばについた・なだめた','attention'),chip('要求に応じた','demand'),chip('物を渡した','demand'),chip('活動をやめた・離れた','escape'),chip('クールダウン(別室)','escape'),chip('見守った(対応なし)','sensory')]
  },
  good:{
    behavior:['自分から伝えられた','待てた','切り替えられた','気持ちを落ち着けられた','やさしくできた','最後までできた'].map(function(l){return chip(l);}),
    antecedent:['予告・見通しを伝えた','活動の切り替え','待ち時間','苦手な活動','友だちと一緒'].map(function(l){return chip(l);}),
    consequence:['ほめた','好きな活動ができた','一緒に喜んだ','見守った'].map(function(l){return chip(l);})
  }
};}

function findChip(chips,type,cat,label){
  var list=(chips[type]&&chips[type][cat])||[];
  for(var i=0;i<list.length;i++){if(list[i].label===label)return list[i];}
  return null;
}

/* 見本データ:4週間分。15時台の「活動の切り替え」→「活動をやめた」が多いパターン */
function makeSample(chips){
  var kid={id:uid(),name:'見本 ゆうと',code:'A',sample:true};
  var seed=11;
  function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  function pick(w){var tot=0,k;for(k in w)tot+=w[k];var r=rnd()*tot;for(k in w){r-=w[k];if(r<=0)return k;}return k;}
  var recs=[],now=Date.now(),today=startOfDay(now);
  for(var d=27;d>=0;d--){
    var day=new Date(today-d*DAY);
    var wd=day.getDay(); if(wd===0)continue;
    var n=wd===1?2+Math.floor(rnd()*2):Math.floor(rnd()*2.6);
    for(var i=0;i<n;i++){
      var h=rnd()<0.5?15:(rnd()<0.5?14:10+Math.floor(rnd()*8));
      var ts=day.getTime()+h*3600000+Math.floor(rnd()*60)*60000;
      var a=pick({'活動の切り替え':6,'苦手な課題・活動':3,'大きな音・人の多さ':2,'要求が通らない':2,'待ち時間':2,'大人が離れた・注目なし':1});
      var b=pick({'大声・叫ぶ':4,'離席・飛び出し':3,'動かない・拒否':3,'泣く':2,'たたく・ける':1});
      var c=pick({'活動をやめた・離れた':5,'声かけ・注意した':3,'クールダウン(別室)':2,'そばについた・なだめた':1,'要求に応じた':1});
      recs.push(mkRec(kid.id,ts,'challenge',b,a,c,1+Math.floor(rnd()*3),'',chips));
    }
    if(rnd()<0.65){
      var g=pick({'待てた':3,'切り替えられた':3,'自分から伝えられた':2,'気持ちを落ち着けられた':1});
      var ga=g==='切り替えられた'?'予告・見通しを伝えた':pick({'予告・見通しを伝えた':3,'待ち時間':2,'苦手な活動':1});
      recs.push(mkRec(kid.id,day.getTime()+(11+Math.floor(rnd()*6))*3600000+Math.floor(rnd()*60)*60000,'good',g,ga,pick({'ほめた':4,'一緒に喜んだ':2,'好きな活動ができた':1}),0,'',chips));
    }
  }
  var memoTargets=recs.filter(function(r){return r.type==='challenge';});
  if(memoTargets.length>2){
    memoTargets[memoTargets.length-1].memo='おやつの後、片付けの合図で大声。タイマーを見せたら5分で落ち着いた。';
    memoTargets[memoTargets.length-3].memo='工作の途中で終わりと伝えたら離席。次は残り時間を先に伝える。';
  }
  recs=recs.filter(function(r){return r.ts<=now;});
  return {kid:kid,recs:recs};
}
function mkRec(childId,ts,type,b,a,c,intensity,memo,chips){
  var ac=findChip(chips,type,'antecedent',a), cc=findChip(chips,type,'consequence',c);

}

function periodRecs(childId,period){

function countBy(recs,key){

function fnScores(recs){
  var s={demand:0,escape:0,attention:0,sensory:0};
  recs.forEach(function(r){if(r.type!=='challenge')return;if(r.cFn&&s[r.cFn]!=null)s[r.cFn]+=2;if(r.aFn&&s[r.aFn]!=null)s[r.aFn]+=1;});

}
function barList(items,color,limit){
  if(!items.length)return '<div class="empty">記録がありません</div>';
  var max=items[0].n,h='<div class="bars" style="--c:var(--'+color+')">';

function hourChart(recs){
  var cnt=new Array(24).fill(0);recs.forEach(function(r){cnt[new Date(r.ts).getHours()]++;});
  var lo=8,hi=19;cnt.forEach(function(n,i){if(n){lo=Math.min(lo,i);hi=Math.max(hi,i);}});
  var cols=hi-lo+1,max=Math.max.apply(null,cnt)||1;
  var gt='grid-template-columns:repeat('+cols+',1fr)';
  var h='<div class="hours" style="'+gt+';--c:var(--challenge)" role="group" aria-label="時間帯ごとの件数">';
  var step=max>4?Math.ceil(max/2):max;
  for(var g=step;g<=max;g+=step)h+='<div class="grid" style="bottom:'+(g/max*100)+'%"></div>';
  for(var i=lo;i<=hi;i++){
    h+='<button type="button" data-act="tipHour" data-v="'+i+'" aria-pressed="'+(ui.tipHour===i)+'" aria-label="'+i+'時台 '+cnt[i]+'件"><span style="height:'+(cnt[i]/max*100)+'%"></span></button>';
  }
  h+='</div><div class="hlabels" style="'+gt+'">';
  for(i=lo;i<=hi;i++)h+='<span>'+((i-lo)%2===0?i:'')+'</span>';
  h+='</div>';
  var top=cnt.map(function(n,i){return {i:i,n:n};}).filter(function(x){return x.n;}).sort(function(a,b){return b.n-a.n;})[0];
  var tip=ui.tipHour!=null?(ui.tipHour+'時台:'+cnt[ui.tipHour]+'件'):(top?'いちばん多いのは '+top.i+'時台('+top.n+'件)。棒をタップすると件数が出ます。':'');
  return h+'<div class="tip" aria-live="polite">'+tip+'</div>';
}
function weekdayItems(recs){

}

/* ---------- AI ---------- */
function anonymize(text){
  var t=text;
  state.children.forEach(function(k){
    var parts=[k.name].concat(k.name.split(/[\s　]+/)).filter(function(p){return p&&p.length>=2;});
    parts.sort(function(a,b){return b.length-a.length;}).forEach(function(p){t=t.split(p).join(k.code+'さん');});
  });
  return t;
}
function buildAIText(recs){
  var k=kid(ui.reviewChild);if(!k)return '';
  var name=k.code+'さん';
  var ch=recs.filter(function(r){return r.type==='challenge';}), gd=recs.filter(function(r){return r.type==='good';});
  var ts=recs.map(function(r){return r.ts;});
  var from=ts.length?Math.min.apply(null,ts):Date.now(), to=ts.length?Math.max.apply(null,ts):Date.now();
  var L=[];
  L.push('以下は、発達支援の現場でつけた行動記録(ABC記録)の集計です。対象は「'+name+'」(仮名)です。');
  L.push('期間:'+fmtYMD(from)+' 〜 '+fmtYMD(to));
  L.push('困った行動:'+ch.length+'件 / できたこと:'+gd.length+'件');
  function sec(title,items,limit){if(!items.length)return;L.push('');L.push('■ '+title);items.slice(0,limit||6).forEach(function(it){L.push('- '+it.label+':'+it.n+'件');});}
  sec('多かった困った行動',countBy(ch,'behavior'));
  sec('きっかけ(行動の前にあったこと)',countBy(ch,'antecedent'));
  sec('その後(大人の対応)',countBy(ch,'consequence'));
  var hc=new Array(24).fill(0);ch.forEach(function(r){hc[new Date(r.ts).getHours()]++;});
  var th=hc.map(function(n,i){return {label:i+'時台',n:n};}).filter(function(x){return x.n;}).sort(function(a,b){return b.n-a.n;});
  sec('起きやすい時間帯',th,3);
  sec('曜日',weekdayItems(ch).filter(function(x){return x.n;}).sort(function(a,b){return b.n-a.n;}),3);
  var ic=[0,0,0,0];ch.forEach(function(r){ic[r.intensity||0]++;});
  if(ch.length){L.push('');L.push('■ 強さ');L.push('- 軽い:'+ic[1]+'件 / 中くらい:'+ic[2]+'件 / 強い:'+ic[3]+'件');}
  sec('できたこと',countBy(gd,'behavior'));
  sec('できたときのきっかけ',countBy(gd,'antecedent'),3);
  if(ui.includeMemo){
    var memos=recs.filter(function(r){return r.memo;}).sort(function(a,b){return b.ts-a.ts;}).slice(0,12);
    if(memos.length){L.push('');L.push('■ 支援者のメモ(抜粋)');memos.forEach(function(r){L.push('- '+fmtDate(r.ts)+' '+TYPES[r.type]+'「'+r.behavior+'」:'+anonymize(r.memo).replace(/\s+/g,' '));});}
  }
  L.push('');
  L.push('お願い:発達支援の支援者向けに、上の記録をやさしい日本語で簡潔にまとめてください。');
  L.push('次の5つの見出しを、この形のまま使ってください。');
  L.push('【全体の傾向】');
  L.push('【起きやすい場面】');
  L.push('【考えられる理由】');
  L.push('【うまくいっていること】');
  L.push('【次に試せる支援】');
  L.push('書き方のきまり:');
  L.push('・各見出しの下は「・」で始まる短い文を2〜3個にする(【次に試せる支援】は具体的に3個)。');
  L.push('・理由は「〜かもしれません」と仮説として書き、断定しない。');
  L.push('・記録に書かれていないこと(昼寝、家庭の様子、体調など)は推測しない。');
  L.push('・字下げ、空行、記号(#、*)は使わない。');
  L.push('・診断名や医学的な判断は書かない。');
  return L.join('\n');
}
/* AIの返事は書式がばらばら(字下げ・空行・#・**・番号)なので、見出し/箇条書き/文に整えて表示する */
function formatNote(text){
  var lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  var out=[],list=[];
  function flush(){if(list.length){out.push('<ul>'+list.join('')+'</ul>');list=[];}}
  var KNOWN=/^(全体の傾向|(困った行動が)?起きやすい場面|考えられる(行動の)?理由|うまくいっていること|次に試せる支援)/;
  function nextIndented(i){for(var j=i+1;j<lines.length;j++){if(lines[j].trim())return /^[\t 　]/.test(lines[j]);}return false;}
  lines.forEach(function(raw,i){
    var s=raw.replace(/[\t　]/g,' ').trim();
    if(!s)return;
    var m, isHead=KNOWN.test(s.replace(/^[#*\d.．、)）\s【]+/,''));
    if((m=s.match(/^#{1,6}\s*(.+)$/)))      {s=m[1];isHead=true;}
    else if((m=s.match(/^【(.+?)】\s*[:：]?$/))){s=m[1];isHead=true;}
    else if((m=s.match(/^\*\*(.+?)\*\*\s*[:：]?$/))){s=m[1];isHead=true;}
    else if((m=s.match(/^\d+\s*[.．、)）]\s*(.+)$/))&&m[1].length<=24&&!/[。．]$/.test(m[1])){s=m[1];isHead=true;}
    else if(s.length<=20&&/[:：]$/.test(s)){s=s.replace(/[:：]$/,'');isHead=true;}
    s=s.replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1');
    if(isHead){
      s=s.replace(/^\d+\s*[.．、)）]\s*/,'').replace(/^【|】\s*[:：]?$/g,'').replace(/\s*[(（][^)）]*[)）]\s*[:：]?$/,'').replace(/[:：]$/,'');
      flush();out.push('<h4>'+esc(s)+'</h4>');return;
    }
    if((m=s.match(/^(?:[-*•・●○◦]|\d+\s*[.．)）])\s*(.+)$/))){list.push('<li>'+esc(m[1])+'</li>');return;}
    flush();
    /* 「昼寝の時間を調整する」→ 字下げした説明、のような小見出しは太字にする */
    if(s.length<=30&&!/[。．!！?？]$/.test(s)&&nextIndented(i))out.push('<p><b>'+esc(s)+'</b></p>');
    else out.push('<p>'+esc(s)+'</p>');
  });
  flush();
  return out.join('');
}

function downloadFile(name,text,mime){
  var file=null;
  try{file=new File([text],name,{type:mime});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(function(){toast('書き出しました');},function(err){if(!err||err.name!=='AbortError'){ui.backupText=text;render();}});
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([text],{type:mime}));
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }catch(e){}

}

    var code='ABCDEFGHJKLMNPQRSTUVWXYZ'.split('').filter(function(L){return used.indexOf(L)<0;})[0]||'X';
    var k={id:uid(),name:v,code:code};state.children.push(k);
    if(!kid(ui.childId)||kid(ui.childId).sample)ui.childId=k.id;
    ui.reviewChild=k.id;save();render();toast(v+' を登録しました');
  },
  delChild:function(b){
    var k=kid(b.dataset.id);if(!k)return;
    var n=state.records.filter(function(r){return r.childId===k.id;}).length;
    ask('「'+k.name+'」と、その記録 '+n+'件をすべて消します。元に戻せません。','消す',function(){
      state.children=state.children.filter(function(x){return x.id!==k.id;});
      state.records=state.records.filter(function(r){return r.childId!==k.id;});
      state.notes=(state.notes||[]).filter(function(x){return x.childId!==k.id;});
      save();render();
    },true);
  },
  setType:function(b){ui.setType=b.dataset.v;render();},
  chipDel:function(b){
    var list=state.chips[ui.setType][b.dataset.cat];
    state.chips[ui.setType][b.dataset.cat]=list.filter(function(c){return c.id!==b.dataset.id;});
    save();render();
  },
  exportJSON:function(){
    var data={app:'abc-kiroku',version:1,exportedAt:new Date().toISOString(),children:state.children,records:state.records,chips:state.chips,notes:state.notes||[]};
    downloadFile('ABC記録_バックアップ_'+stamp()+'.json',JSON.stringify(data),'application/json');
  },
  exportCSV:function(){downloadFile('ABC記録_'+stamp()+'.csv',buildCSV(),'text/csv');},
  copyBackup:function(){copyText(ui.backupText,'コピーしました','backupText');},
  importPick:function(){document.getElementById('importFile').click();},
  importText:function(){var t=document.getElementById('restoreText');if(t&&t.value.trim())restoreFrom(t.value.trim());else toast('バックアップの文字を貼り付けてください');},
  clearSample:function(){
    ask('見本データ(見本 ゆうと)を消します。自分で入れた記録は残ります。','見本を消す',function(){
      var ids=state.children.filter(function(k){return k.sample;}).map(function(k){return k.id;});
      state.children=state.children.filter(function(k){return !k.sample;});
      state.records=state.records.filter(function(r){return ids.indexOf(r.childId)<0;});
      state.notes=(state.notes||[]).filter(function(n){return ids.indexOf(n.childId)<0;});
      resetForm();save();render();toast('見本を消しました');
    });
  },
  loadSample:function(){var s=makeSample(state.chips);state.children.push(s.kid);state.records=state.records.concat(s.recs);save();render();toast('見本データを入れました');},
  clearAll:function(){
    ask('記録する人・記録・まとめをすべて消します。ボタンの項目は残ります。元に戻せません。','すべて消す',function(){
      state.children=[];state.records=[];state.notes=[];resetForm();save();render();toast('すべて消しました');
    },true);
  },
  confirmYes:function(){var f=pendingConfirm;closeSheet();if(f)f();},
  confirmNo:function(){closeSheet();}
};

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var f=A[b.dataset.act];if(!f)return;
  if(b.dataset.act!=='shortcutAI')e.preventDefault();
  f(b,e);
});
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeSheet();});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset.bind;
  if(k==='memo'){ui.memo=t.value;}
  else if(k==='time'){ui.time=t.value;}
  else if(k==='aiResult'){setResult(t.value);}
  else if(t.dataset.bindKid){var kd=kid(t.dataset.bindKid);if(kd){kd.name=t.value.trim()||kd.name;save();}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.bind==='includeMemo'){ui.includeMemo=t.checked;var ta=document.getElementById('aiText');ui.aiText=buildAIText(periodRecs(ui.reviewChild,ui.period));if(ta)ta.value=ui.aiText;}
  else if(t.dataset.kidCode){var kd=kid(t.dataset.kidCode);if(kd){kd.code=t.value;save();}}
  else if(t.dataset.chipFn){var list=state.chips.challenge[t.dataset.cat];list.forEach(function(c){if(c.id===t.dataset.chipFn)c.fn=t.value;});save();}
  else if(t.id==='importFile'&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){restoreFrom(String(fr.result));};fr.readAsText(t.files[0]);t.value='';}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSheet();return;}
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='newChip'){var b=document.querySelector('[data-act="addChipOk"]');if(b){e.preventDefault();A.addChipOk(b);}}
  if(e.target.id==='newChild'){e.preventDefault();A.addChild();}
});

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
var h0=(location.hash||'').slice(1);if(h0==='review'||h0==='settings')ui.tab=h0;
render();
resumeFromShortcut();
})();
</script>
